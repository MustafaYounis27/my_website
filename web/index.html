<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Portfolio website for Mustafa Mahmoud — Senior Mobile Engineer.">
  <meta name="theme-color" content="#0066CC">

  <!-- Open Graph / Social -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Mustafa Mahmoud — Senior Mobile Engineer">
  <meta property="og:description" content="Portfolio, experience, and projects built with Flutter Web.">
  <meta property="og:image" content="icons/Icon-512.png">
  <meta property="og:url" content="/">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Mustafa Mahmoud Portfolio">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Mustafa Mahmoud — Senior Mobile Engineer</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body { margin: 0; height: 100%; background: #f4f3fa; }
    #boot-status {
      position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      font: 600 16px/1.4 system-ui, -apple-system, Segoe UI, sans-serif; color: #4338ca;
      z-index: 9999; pointer-events: none;
    }
    #boot-status.error { color: #b3261e; padding: 24px; text-align: center; max-width: 520px; }
  </style>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-KD8EDT64BT"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);} 
    gtag('js', new Date());
    gtag('config', 'G-KD8EDT64BT');
  </script>
</head>
<body>
  <div id="boot-status">Loading portfolio…</div>
  <script>
    (function () {
      var status = document.getElementById('boot-status');
      function showError(msg) {
        if (!status) return;
        status.className = 'error';
        status.textContent = msg;
        status.style.pointerEvents = 'auto';
      }
      window.addEventListener('error', function (e) {
        showError('Load error: ' + (e.message || 'unknown') + '. Try a hard refresh.');
        console.error(e.error || e.message);
      });
      window.addEventListener('unhandledrejection', function (e) {
        var reason = e.reason && (e.reason.message || e.reason);
        showError('Startup failed: ' + (reason || 'unknown') + '. Check Network tab.');
        console.error(e.reason);
      });
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function (regs) {
          regs.forEach(function (r) { r.unregister(); });
        });
      }
    })();
  </script>
  <script src="flutter_bootstrap.js?v=4" async></script>
</body>
</html>
